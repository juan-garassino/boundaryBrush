[project]
name = "boundarybrush"
version = "0.1.0"
description = "Promptable segmentation: a U-Net, a from-scratch mini-SAM and pretrained SlimSAM behind one predictor API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Juan Garassino" }]
dependencies = [
    "torch==2.2.2",        # last macOS x86_64 wheel; CPU wheels on linux via the pytorch-cpu index
    "torchvision==0.17.2",
    "numpy>=1.24,<2",      # torch 2.2.2 is built against numpy 1.x
    "pillow>=10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
sam = ["transformers>=4.49,<5"]  # transformers 5 needs torch>=2.5
dev = ["pytest>=7.2", "ruff>=0.6"]
all = ["boundarybrush[sam,dev]"]

[project.scripts]
boundarybrush = "boundarybrush.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boundarybrush"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]
markers = ["slow: needs real data, weights or network"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
